<script>
/* DIGITAL CORE II — standalone visual prototype. No file contents are read.

(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:true});

const percent=$('percent'),processLabel=$('processLabel');

const media=matchMedia('(prefers-reduced-motion: reduce)');
const PI=Math.PI,TAU=PI*2,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;

let reduced=media.matches,last=0,raf=0,lastPercent=-1,phase=-1,filename='example.csv';

const V=(x,y,z)=>({x,y,z});

 let vertices=[V(-1,t,0),V(1,t,0),V(-1,-t,0),V(1,-t,0),V(0,-1,t),V(0,1,t),V(0,-1,-t),V(0,1,-t),V(t,0,-1),V(t,0,1),V(-t,0,-1),V(-t,0,1)].map(normalize);
 let faces=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
 for(let level=0;level<2;level++){
  const cache=new Map();const midpoint=(a,b)=>{const key=Math.min(a,b)+':'+Math.max(a,b);if(cache.has(key))return cache.get(key);const p=vertices[a],q=vertices[b],i=vertices.length;vertices.push(normalize(V((p.x+q.x)*.5,(p.y+q.y)*.5,(p.z+q.z)*.5)));cache.set(key,i);return i};
  const next=[];for(const [a,b,c] of faces){const ab=midpoint(a,b),bc=midpoint(b,c),ca=midpoint(c,a);next.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])}faces=next;
 }
 const edgeMap=new Map(),adj=vertices.map(()=>[]);
 for(const [a,b,c] of faces)for(const [i,j] of [[a,b],[b,c],[c,a]]){const key=Math.min(i,j)+':'+Math.max(i,j);if(!edgeMap.has(key)){edgeMap.set(key,[i,j]);adj[i].push(j);adj[j].push(i)}}

const shell=makeShell();

const fragments=Array.from({length:155},()=>({x:rand(-.18,.18),y:rand(-.23,.23),delay:rand(0,.5),spin:rand(-1,1),phase:rand(0,TAU),size:rand(.7,1.9)}));
const glyphPaths=[[-.22,-.34,.1,-.34],[.1,-.34,.24,-.2],[.24,-.2,.24,.29],[.24,.29,-.22,.29],[-.22,.29,-.22,-.34],[.1,-.34,.1,-.2],[.1,-.2,.24,-.2],[-.155,-.075,-.155,.06],[-.155,0,-.09,-.075],[-.155,0,-.09,.06],[-.04,.06,-.04,-.075],[-.04,-.075,.007,-.01],[.007,-.01,.052,-.075],[.052,-.075,.052,.06],[.095,-.075,.18,-.075],[.18,-.075,.095,.06],[.095,.06,.18,.06],[-.07,.17,-.015,.22],[-.015,.22,.095,.12]];

// Cached radial lights: no per-particle shadow blur or gradient allocation.
function lightSprite(rgb){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),g=x.createRadialGradient(48,48,0,48,48,48);g.addColorStop(0,`rgba(${rgb},1)`);g.addColorStop(.06,`rgba(${rgb},.8)`);g.addColorStop(.22,`rgba(${rgb},.19)`);g.addColorStop(.55,`rgba(${rgb},.035)`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(0,0,96,96);return c}
const blue=lightSprite('133,213,250'),white=lightSprite('218,241,255'),mint=lightSprite('151,242,207');
function light(x,y,r,a,sprite=blue){if(a<=0||r<=0)return;ctx.globalAlpha=clamp(a);ctx.drawImage(sprite,x-r,y-r,r*2,r*2);ctx.globalAlpha=1}

function resize(){
 const rect=stage.getBoundingClientRect();W=rect.width||600;H=rect.height||W;R=W*.415;
 viewW=window.innerWidth||W;viewH=window.innerHeight||H;sceneX=rect.left;sceneY=rect.top;
 dpr=Math.min(window.devicePixelRatio||1,W<450?1.65:2,Math.sqrt(3600000/(viewW*viewH)));
 canvas.width=Math.round(viewW*dpr);canvas.height=Math.round(viewH*dpr);
 // Keep the core aligned with its controls; the light is free to extend across the page.

}
function setUIState(next,force=false){
 if(state===next&&!force)return;state=next;stateAge=0;stage.dataset.state=next;hit.disabled=['absorb','process'].includes(next);stage.setAttribute('aria-busy',String(['absorb','process'].includes(next)));
 $('portalCopy').setAttribute('aria-hidden',String(['absorb','process','success'].includes(next)));
 hit.setAttribute('aria-label',next==='success'?'Обрати інший CSV':'Обрати CSV для конвертації');
 progressA11y.hidden=!['absorb','process'].includes(next);
 if(next==='idle'||next==='hover'){
  statusText.textContent=next==='hover'?'Відпусти файл у центрі сфери':'Готовий прийняти твій файл';
  $('dropText').textContent=next==='hover'?'Відпусти CSV тут':'Перетягни CSV';
 }
 if(next==='absorb'){statusText.textContent='Поглинання файлу '+filename;phase=0;}
 if(next==='process'){statusText.textContent='Упорядкування даних';phase=-1}
 if(next==='success'){statusText.textContent='KMZ сформовано. Можна обрати інший CSV.';burst=1;}
 wake();
}
function reset(hovering=false){demoActive=false;demoElapsed=0;progress=0;phase=-1;lastPercent=-1;morph=0;burst=0;dragDepth=0;hoverLock=hovering;setUIState(hovering?'hover':'idle',true);wake()}
function startDemo(name='example.csv'){
 filename=name;hoverLock=false;demoElapsed=0;progress=0;morph=0;burst=0;lastPercent=-1;demoActive=true;dragDepth=0;setUIState('absorb',true);percent.textContent='0';progressA11y.setAttribute('aria-valuenow','0');wake();
}
function showError(message){
 demoActive=false;demoElapsed=0;progress=0;
 setUIState('error',true);
 statusText.textContent=message;
 $('dropText').textContent='Помилка конвертації';
 hit.disabled=false;
 wake();
}
function acceptFiles(files){
 if(demoActive)return;
 if(!files||files.length!==1){showError('Оберіть один CSV');return}
 const file=files[0];
 if(!/\.csv$/i.test(file.name)){showError('Потрібен файл .csv');return}
 if(file.size>20*1024*1024){showError('CSV перевищує 20 МБ');return}
 startDemo(file.name);
 window.geoPendingFile=file;
 window.dispatchEvent(new Event('geo:input'));
}
window.geoVisual={
 progress(value,label){
  progress=clamp(Number(value)/100);
  const n=Math.round(progress*100);
  percent.textContent=String(n);
  progressA11y.setAttribute('aria-valuenow',String(n));
  if(label){processLabel.textContent=label;statusText.textContent=label}
  wake();
 },
 success(){
  demoActive=false;progress=1;percent.textContent='100';
  progressA11y.setAttribute('aria-valuenow','100');
  setUIState('success',true);
 },
 error(message){showError(message||'Не вдалося створити KMZ. Перевір TXT-звіт.')}
};
function update(dt){
 stateAge+=dt;
 if(!reduced){time+=dt;yaw+=dt*(.065+energy*.12);px+= (tx-px)*Math.min(1,dt*4.5);py+=(ty-py)*Math.min(1,dt*4.5)}else{px=0;py=0}
 const busy=state==='absorb'||state==='process',wantHover=state==='hover'||state==='absorb'?1:0;
 hover=mix(hover,wantHover,reduced?1:1-Math.exp(-dt*4));energy=mix(energy,busy?1:state==='success'?.42:state==='hover'?.42:0,reduced?1:1-Math.exp(-dt*2.5));
 aperture=mix(aperture,state==='absorb'?1:state==='hover'?.23:0,reduced?1:1-Math.exp(-dt*4));
 morph=state==='success'?(reduced?1:smooth(stateAge/1.7)):0;burst=state==='success'?(reduced?0:clamp(1-stateAge/2.8)):0;
 // Real progress is supplied by the conversion engine, not a timer.
 if(demoActive){
  demoElapsed+=dt;
  if(demoElapsed>=.75&&state==='absorb')setUIState('process');
 }
 for(const packet of packets){
  if(reduced)continue;packet.t+=dt*packet.speed*(.7+energy*2.5);
  while(packet.t>=1){packet.t-=1;const old=packet.a;packet.prev=old;packet.a=packet.b;const choices=shell.adj[packet.a].filter(x=>x!==old);packet.b=choices[Math.floor(random()*choices.length)]}
 }
}
function glass(cx,cy){
 const r=R*.805;
 let g=ctx.createRadialGradient(cx-r*.34,cy-r*.45,r*.02,cx,cy,r);
 g.addColorStop(0,'rgba(85,125,147,.13)');g.addColorStop(.4,'rgba(21,40,57,.28)');g.addColorStop(.78,'rgba(9,23,36,.65)');g.addColorStop(.94,'rgba(50,88,109,.16)');g.addColorStop(1,'rgba(151,214,232,.025)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
 g=ctx.createRadialGradient(cx,cy,r*.77,cx,cy,r*1.015);g.addColorStop(0,'rgba(100,188,220,0)');g.addColorStop(.72,`rgba(115,192,220,${.025+energy*.025})`);g.addColorStop(.92,'rgba(170,217,234,.065)');g.addColorStop(1,'rgba(130,190,219,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.015,0,TAU);ctx.fill();
 const shine=-2.2+Math.sin(time*.19)*.38+px*.3;
 for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(cx,cy,r*(.981-i*.006),shine-.40,shine+.14);ctx.strokeStyle=`rgba(187,232,249,${(.07-i*.006)*(1+hover*.65)})`;ctx.lineWidth=i===0?1:.6;ctx.stroke()}
 ctx.beginPath();ctx.arc(cx,cy,r*.99,shine+PI-.16,shine+PI+.4);ctx.strokeStyle='rgba(147,214,232,.14)';ctx.lineWidth=.75;ctx.stroke();
 light(cx-R*.25,cy-R*.29,R*.8,.2+energy*.14);light(cx+R*.29,cy+R*.29,R*.64,.11+energy*.11,state==='success'?mint:blue);
 // Broad, translucent filaments in a true rotating volume.
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r*.99,0,TAU);ctx.clip();
 for(let k=0;k<8;k++){
  let previous=null;const angle=k*.61+time*(.065+(k%3)*.014);
  const count=quality<.8?60:85;
  for(let j=0;j<count;j++){
   const t=j/(count-1),a=t*TAU*1.04,rr=.57+.046*Math.sin(a*3+time*.22+k);
   const q=rotate(V(Math.cos(a)*rr,Math.sin(a)*rr,(t-.5)*.25),angle,.46+Math.sin(k)*.56,time*.035+k*.2);
   const p=project(q),fade=Math.pow(Math.sin(t*PI),1.5),alpha=fade*(.012+energy*.013)*(1+(q.z+.7)*.4);
   if(previous){line(previous,p,`rgba(111,192,226,${alpha})`,(k%3===0?9:4)*W/600);line(previous,p,`rgba(154,217,243,${alpha*1.9})`,.7)}previous=p;
  }

}
function orbitSegments(){
 const result=[];
 for(let k=0;k<2;k++){
  const radius=1.035+k*.075,rot=time*(k?-.08:.105)+k*1.3;
  let lastPoint=null;
  for(let j=0;j<=140;j++){
   const a=TAU*j/140,v=rotate(V(Math.cos(a)*radius,Math.sin(a)*radius,0),k?-.7:.3,k?.72:1.1,rot);
   const p=project(v);if(lastPoint){const bright=Math.pow(Math.max(0,Math.cos(a-time*.35-k)),13);result.push({a:lastPoint,b:p,z:(lastPoint.z+p.z)*.5,alpha:.035+bright*(.17+energy*.19),bright})}lastPoint=p;
  }

 return result;
}
function drawOrbits(list,front){for(const seg of list){if((seg.z>=0)!==front)continue;line(seg.a,seg.b,`rgba(157,209,231,${seg.alpha*(front?1:.4)})`,seg.bright>.6?1:.6);if(seg.bright>.985&&front)light(seg.b.x,seg.b.y,13,.24+energy*.22)}}
function drawMesh(points,front){
 const fade=1-morph*.5;
 for(const [ia,ib] of shell.edges){
  const a=points[ia],b=points[ib],z=(a.z+b.z)*.5;if((z>=0)!==front)continue;
  const proximity=hover*Math.max(0,1-Math.hypot((a.x-W*.5)/R-px*1.2,(a.y-H*.5)/R-py*1.2)/.75);
  const band=Math.pow(Math.max(0,Math.sin((a.x+b.x)*.009+time*.53+z*2)),10)*energy;
  const alpha=((front?.032+.12*Math.pow(z,2):.024)+proximity*.2+band*.045)*fade;
  line(a,b,`rgba(174,213,232,${alpha})`,front?.62+Math.max(0,z)*.24:.45);
 }
 if(front)for(let i=0;i<points.length;i++){
  const p=points[i];if(p.z<0)continue;const z=Math.max(0,p.z);ctx.fillStyle=`rgba(191,224,239,${(.15+z*.42+hover*.15)*fade})`;ctx.beginPath();ctx.arc(p.x,p.y,.6+z*.47,0,TAU);ctx.fill();
  if(i%19===0)light(p.x,p.y,12,.17+energy*.13);

}
function drawPackets(points){
 const count=quality<.8?16:23;
 for(let i=0;i<count;i++){
  const p=packets[i],a=points[p.a],b=points[p.b],head={x:mix(a.x,b.x,p.t),y:mix(a.y,b.y,p.t)},z=mix(a.z,b.z,p.t);
  const opacity=(z<0?.10:.46+z*.34)*(.33+energy*.8+hover*.4)*(1-morph*.45);
  const tail={x:mix(a.x,b.x,Math.max(0,p.t-.38)),y:mix(a.y,b.y,Math.max(0,p.t-.38))};
  line(tail,head,`rgba(155,222,246,${opacity*.56})`,1.2);light(head.x,head.y,13+energy*7,opacity*.9);
  ctx.fillStyle=`rgba(219,247,255,${opacity})`;ctx.beginPath();ctx.arc(head.x,head.y,.8+energy*.3,0,TAU);ctx.fill();

}
function drawParticles(){
 const count=Math.floor(particles.length*quality),list=[];
 for(let i=0;i<count;i++){
  const s=particles[i],drift=reduced?0:Math.sin(time*s.speed+s.a)*.027;
  const q=rotate(V(s.p.x+drift*.4,s.p.y+drift,s.p.z),yaw*.65+s.a*.025,-.2+py*.1,time*.018);
  const target=glyph[Math.floor(s.target*glyph.length)];
  if(morph>0){const curl=(1-morph)*Math.sin(morph*PI)*.4;q.x=mix(q.x,target.x,morph)+Math.sin(s.a+morph*TAU)*curl;q.y=mix(q.y,target.y,morph)+Math.cos(s.a+morph*TAU)*curl;q.z*=1-morph}
  const p=project(q);list.push({p,s,q});

 list.sort((a,b)=>a.q.z-b.q.z);
 for(const {p,s,q} of list){
  const dist=Math.hypot(q.x,q.y),textSpace=state==='idle'||state==='hover'||state==='process';
  const fade=textSpace?clamp((dist-.19)/.29,.10,1):1;
  const alpha=(.26+q.z*.3+s.brightness*.26)*(reduced?1:.78+.22*Math.sin(time*.75+s.a))*fade*(1+energy*.34);
  const a=mix(alpha,.5+s.brightness*.45,morph),sz=mix(s.size*(.8+q.z*.25),.68+s.brightness*.38,morph)*W/600;
  ctx.fillStyle=state==='success'?`rgba(174,236,220,${clamp(a)})`:`rgba(180,223,244,${clamp(a)})`;
  ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.35,sz),0,TAU);ctx.fill();
  if(s.brightness>.91)light(p.x,p.y,(morph?6:8)*W/600,a*.38,morph?mint:blue);
 }

}
function opening(){
 if(aperture<.02)return;

  const a=TAU*i/150,q=rotate(V(Math.cos(a)*.87,Math.sin(a)*.10,Math.sin(a)*.87),.13,-.15,.11),p=project(q);

function inputCard(){

 const age=stateAge,p=clamp(age/1.2),e=ease(p),cx=W*.5+mix(-R*.75,0,e),cy=H*.5+mix(-R*.38,0,e),sz=W/600;
 if(p<.9){ctx.save();ctx.translate(cx,cy);ctx.rotate(mix(-.16,.25,p));ctx.scale(mix(1,.28,e)*sz,mix(1,.28,e)*sz);ctx.globalAlpha=1-smooth((p-.38)/.5);ctx.fillStyle='rgba(24,48,64,.85)';ctx.strokeStyle='#afdeef';ctx.lineWidth=.85;ctx.beginPath();ctx.moveTo(-31,-40);ctx.lineTo(14,-40);ctx.lineTo(31,-23);ctx.lineTo(31,40);ctx.lineTo(-31,40);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(14,-40);ctx.lineTo(14,-23);ctx.lineTo(31,-23);ctx.stroke();ctx.fillStyle='#e0f5ff';ctx.font='500 14px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.fillText('CSV',0,4);ctx.strokeStyle='#719eb5';for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(-17,17+j*5);ctx.lineTo(16,17+j*5);ctx.stroke()}ctx.restore()}
 for(const f of fragments){
  const t=clamp((age-f.delay)/1.12);if(t<=0||t>=1)continue;const v=1-ease(t),curl=Math.sin(t*PI)*.37;
  const x=W*.5+R*((-.75+f.x)*v+Math.sin(t*5+f.phase)*curl),y=H*.5+R*((-.38+f.y)*v+Math.cos(t*5+f.phase)*curl*.65);
  const a=Math.sin(t*PI);light(x,y,10,a*.6);ctx.fillStyle=`rgba(204,240,255,${a})`;ctx.fillRect(x,y,f.size*sz,f.size*sz);

}

 for(let k=0;k<80;k++){const a=TAU*k/80-PI*.5;const done=k/80<progress;const a1={x:cx+Math.cos(a)*(r-3),y:cy+Math.sin(a)*(r-3)},a2={x:cx+Math.cos(a)*(r+(k%5===0?2:0)),y:cy+Math.sin(a)*(r+(k%5===0?2:0))};line(a1,a2,done?'rgba(152,216,239,.45)':'rgba(123,169,192,.10)',.6)}
 ctx.beginPath();ctx.arc(cx,cy,r,-PI*.5,TAU*progress-PI*.5);ctx.strokeStyle='rgba(177,227,247,.75)';ctx.lineWidth=1.1;ctx.stroke();const a=TAU*progress-PI*.5;light(cx+Math.cos(a)*r,cy+Math.sin(a)*r,18,.9,white);
}
function render(dt){
 if(!ctx)return;ctx.clearRect(-sceneX,-sceneY,viewW,viewH);const cx=W*.5,cy=H*.5;
 for(const s of stars){const f=reduced?1:.8+.2*Math.sin(time*.25+s.phase);ctx.fillStyle=`rgba(158,199,222,${s.a*f})`;ctx.beginPath();ctx.arc(cx+s.x*R-px*3,cy+s.y*R-py*3,s.r,0,TAU);ctx.fill()}
 light(cx,cy,R*2.0,.4+energy*.27,state==='success'?mint:blue);
 light(cx-R*.5+px*R*.13,cy-R*.4+py*R*.13,R*1.25,.23+hover*.32);
 const breath=reduced?1:1+Math.sin(time*.55)*.008;
 const points=shell.vertices.map(v=>{
  const q=rotate(v,yaw+px*.1,-.21+py*.13+Math.sin(time*.14)*.075,Math.sin(time*.07)*.07);
  const proximity=hover*Math.exp(-((q.x-px*1.2)**2+(q.y-py*1.2)**2)*4)*Math.max(0,q.z);
  const stretch=1+proximity*.065;
  q.x*=breath*stretch;q.y=q.y*breath*stretch+Math.sign(q.y)*aperture*.075*Math.exp(-Math.abs(q.y)*4);q.z*=breath;return project(q);
 });
 const orbits=orbitSegments();drawOrbits(orbits,false);drawMesh(points,false);glass(cx,cy);drawParticles();opening();drawMesh(points,true);drawOrbits(orbits,true);drawPackets(points);inputCard();progressRing();
 if(burst>0){const p=1-burst;ctx.beginPath();ctx.arc(cx,cy,R*(.75+p*.7),0,TAU);ctx.strokeStyle=`rgba(164,241,214,${Math.sin(p*PI)*.24})`;ctx.lineWidth=1.4-p;ctx.stroke();light(cx,cy,R*(1+p),burst*.25,mint)}

function loop(now){

function wake(){if(!raf&&!document.hidden)raf=requestAnimationFrame(loop)}

stage.addEventListener('pointerleave',()=>{tx=ty=0;if(state==='hover'&&!hoverLock&&!dragDepth)setUIState('idle')});
hit.addEventListener('pointerenter',()=>{if(state==='idle')setUIState('hover')});
hit.addEventListener('pointerleave',()=>{if(state==='hover'&&!hoverLock&&!dragDepth)setUIState('idle')});
hit.addEventListener('focus',()=>{if(state==='idle')setUIState('hover')});
hit.addEventListener('blur',()=>{if(state==='hover'&&!hoverLock&&!dragDepth)setUIState('idle')});
hit.addEventListener('click',()=>{if(!demoActive)input.click()});
input.addEventListener('change',()=>{if(input.files&&input.files.length)acceptFiles(input.files);input.value=''});
const isFileDrag=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
window.addEventListener('dragover',e=>{if(isFileDrag(e))e.preventDefault()});
window.addEventListener('drop',e=>{if(isFileDrag(e))e.preventDefault();dragDepth=0;if(state==='hover'&&!hoverLock)setUIState('idle')});
stage.addEventListener('dragenter',e=>{if(!isFileDrag(e)||demoActive)return;e.preventDefault();dragDepth++;setUIState('hover')});
stage.addEventListener('dragover',e=>{if(!isFileDrag(e))return;e.preventDefault();e.dataTransfer.dropEffect=demoActive?'none':'copy'});
stage.addEventListener('dragleave',e=>{if(!isFileDrag(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth&&state==='hover'&&!hoverLock)setUIState('idle')});
stage.addEventListener('drop',e=>{if(!isFileDrag(e))return;e.preventDefault();e.stopPropagation();dragDepth=0;acceptFiles(e.dataTransfer.files)});
media.addEventListener('change',e=>setMotion(e.matches));

if('ResizeObserver' in window)new ResizeObserver(resize).observe(stage);

if(!ctx){statusText.textContent='Цей браузер не підтримує Canvas';hit.disabled=true;return}
setMotion(reduced);resize();wake();
})();

<script type="module">
import JSZip from 'https://esm.sh/jszip@3.10.1';
import * as mgrs from 'https://esm.sh/mgrs@2.1.0';
// Existing conversion engine remains unchanged. Only UI wiring is replaced.
let busy=false,reportText='',reportFile='report.txt';
const reportBtn=document.getElementById('report');
const reportLine=message=>{reportText+='\n'+message};
const setProgress=(p,label)=>window.geoVisual?.progress(p,label);
const setStatus=(message,kind='')=>{
 if(kind==='success')window.geoVisual?.success();
 else if(kind==='error')window.geoVisual?.error(message);
};
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>resolve()));
reportBtn.addEventListener('click',()=>{
 if(!reportText)return;
 const blob=new Blob(['\uFEFF'+reportText],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=reportFile;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
});
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  let sample='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){i++;continue}quoted=!quoted}
  if(!quoted&&(c==='\n'||c==='\r'))break;sample+=c}
  const separators=[';',',','\t'];
  const counts=separators.map(sep=>{let q=false,n=0;for(let i=0;i<sample.length;i++){let c=sample[i];if(c==='"'){if(q&&sample[i+1]==='"'){i++;continue}q=!q}else if(!q&&c===sep)n++}return n});
  if(Math.max(...counts)===0)throw Error('Не вдалося визначити роздільник CSV');
  const sep=separators[counts.indexOf(Math.max(...counts))];
  let rows=[],row=[],field='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
  if(c==='"'){if(q&&text[i+1]==='"'){field+='"';i++}else if(q){q=false}else if(!field.trim()){q=true}else{field+=c}}
  else if(c===sep&&!q){row.push(field);field=''}
  else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}
  else field+=c}
  if(q)throw Error('Незакриті лапки у CSV');
  row.push(field);if(row.some(x=>x.trim()))rows.push(row);
  if(rows.length<2)throw Error('CSV має містити заголовки та хоча б один рядок');
  const headers=rows.shift().map((x,i)=>x.trim()||'column_'+(i+1));
  if(new Set(headers.map(h=>normalize(h))).size!==headers.length)throw Error('CSV має дубльовані заголовки колонок');
  const bad=rows.findIndex(r=>r.length!==headers.length);
  if(bad>=0)throw Error('Рядок '+(bad+2)+': кількість полів '+rows[bad].length+' замість '+headers.length);
  return {headers,records:rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i].trim()]))),sep};
}
const normalize=s=>String(s).normalize('NFKC').toLowerCase().replace(/[\uFEFF\u200B\s_\-().]/g,'');
function column(headers,variants){return headers.find(h=>variants.includes(normalize(h)))}
function num(s){let v=Number(String(s).trim().replace(',','.'));return s!==''&&Number.isFinite(v)?v:NaN}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}

function isMgrs(str){
  if(!str) return false;
  const s = String(str).trim().replace(/\s+/g,'');
  return /^[0-9]{1,2}[C-X][A-Z]{2}[0-9]{2,10}$/i.test(s) || /^[0-9]{1,2}[C-X]\s*[A-Z]{2}\s*[0-9]+\s*[0-9]+$/i.test(str.trim());
}
function parseMgrs(str){
  if(!str) throw new Error('порожній MGRS');
  const clean = String(str).trim().replace(/\s+/g,' ');
  try{
    const pt = mgrs.toPoint(clean.replace(/\s+/g,''));
    if(!pt || pt.length < 2) throw new Error('невалідний результат');
    return {lon: pt[0], lat: pt[1]};
  }catch(e){
    throw new Error('не вдалося розпарсити MGRS: '+clean);
  }
}

async function processFile(file){
  if(busy)return;
  busy=true;
  setProgress(0,'Початок…');
  await frame();
  reportText='GEO CONVERTER — CSV REPORT\nФайл: '+file.name+'\nРозмір: '+file.size+' байтів';
  reportFile=file.name.replace(/\.csv$/i,'')+'_report.txt';
  reportBtn.disabled=true;
  try{
  if(file.size>20*1024*1024)throw Error('Файл перевищує обмеження 20 МБ');
  if(!/\.csv$/i.test(file.name))throw Error('Оберіть файл .csv');
  setStatus('');
  setProgress(5,'Читання CSV…');
  const content=await file.text();
  setProgress(15,'Перевірка структури…');
  await frame();
  const {headers,records,sep}=parseCSV(content);
  setProgress(25,'Обробка…');
  await frame();
  reportLine('Записів: '+records.length);reportLine('Колонок: '+headers.length);reportLine('Імпорт: успішно');reportLine('Роздільник: '+(sep==='\t'?'табуляція':sep));

  const latc=column(headers,['lat','latitude','широта','wgs84lat','wgs84latitude','gpslatitude']);
  const lonc=column(headers,['lon','lng','long','longitude','довгота','wgs84lon','wgs84longitude','gpslongitude']);
  const mgrsFirst = headers.find(h => /координати.*(перш|start|first)/i.test(h) || /mgrs.*first/i.test(h) || normalize(h).includes('координатипершої'));
  const mgrsLast = headers.find(h => /координати.*(остан|end|last)/i.test(h) || /mgrs.*last/i.test(h) || normalize(h).includes('координатиостанньої'));
  const mgrsAny = headers.filter(h => isMgrs(records[0]?.[h] || ''));

  let mode = 'none';
  if(latc && lonc) mode = 'wgs';
  else if(mgrsFirst && mgrsLast) mode = 'mgrs-pair';
  else if(mgrsAny.length >= 1) mode = 'mgrs-single';

  if(mode === 'none'){
    reportLine('Заголовки: '+headers.join(' | '));
    throw Error('Не знайдено колонок координат (WGS84 latitude/longitude або MGRS).');
  }
  reportLine('Режим координат: '+mode);

  const namec=column(headers,['name','title','назва','найменування','object','обєкт','id','номерцілі','номер']);
  let placemarks=[],errors=[],exported=0;

  for(let i=0;i<records.length;i++){
    const record=records[i];
    if(i%250===0){setProgress(25+55*i/records.length,'Обробка…');await frame();}
    try{
      const attrs=Object.entries(record).map(([k,v])=>'<Data name="'+esc(k)+'"><value>'+esc(v)+'</value></Data>').join('');
      const name=(namec&&record[namec])||'Об’єкт '+(i+1);

      if(mode === 'wgs'){
        const lat=num(record[latc]),lon=num(record[lonc]);
        if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)throw Error('координати поза межами WGS84');
        placemarks.push('<Placemark><name>'+esc(name)+'</name><ExtendedData>'+attrs+'<Data name="WGS84_lat"><value>'+lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+lon.toFixed(8)+','+lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        exported++;
      } else if(mode === 'mgrs-pair'){
        const p1 = parseMgrs(record[mgrsFirst]);
        const p2 = parseMgrs(record[mgrsLast]);
        // Point start
        placemarks.push('<Placemark><name>'+esc(name+' (початок)')+'</name><ExtendedData>'+attrs+'<Data name="point_type"><value>start</value></Data><Data name="WGS84_lat"><value>'+p1.lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+p1.lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+p1.lon.toFixed(8)+','+p1.lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        // Point end
        placemarks.push('<Placemark><name>'+esc(name+' (кінець)')+'</name><ExtendedData>'+attrs+'<Data name="point_type"><value>end</value></Data><Data name="WGS84_lat"><value>'+p2.lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+p2.lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+p2.lon.toFixed(8)+','+p2.lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        // Line
        const coords = p1.lon.toFixed(8)+','+p1.lat.toFixed(8)+',0 '+p2.lon.toFixed(8)+','+p2.lat.toFixed(8)+',0';
        placemarks.push('<Placemark><name>'+esc(name+' (трек)')+'</name><ExtendedData>'+attrs+'<Data name="geometry"><value>LineString</value></Data></ExtendedData><LineString><tessellate>1</tessellate><coordinates>'+coords+'</coordinates></LineString></Placemark>');
        exported += 3;
      } else if(mode === 'mgrs-single'){
        const col = mgrsAny[0];
        const p = parseMgrs(record[col]);
        placemarks.push('<Placemark><name>'+esc(name)+'</name><ExtendedData>'+attrs+'<Data name="WGS84_lat"><value>'+p.lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+p.lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+p.lon.toFixed(8)+','+p.lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        exported++;
      }
    }catch(e){errors.push('Рядок '+(i+2)+': '+e.message)}
  }
  setProgress(80,'Завершення…');
  await frame();

  reportLine('Помилкових рядків: '+errors.length);
  if(errors.length)reportLine('Деталі помилок:\n'+errors.slice(0,50).join('\n')+(errors.length>50?'\n…':''));
  if(errors.length === records.length)throw Error('Усі рядки мають помилки координат.');
  if(!placemarks.length)throw Error('Немає об’єктів для конвертації');

  reportLine('Експортовано Placemark: '+placemarks.length);
  reportLine('Оброблено записів: '+(records.length - errors.length));

  const xml='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+esc(file.name)+'</name>'+placemarks.join('')+'</Document></kml>';
  const zip=new JSZip();zip.file('doc.kml',xml);
  setProgress(88,'Архівація KMZ…');
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},meta=>setProgress(88+Math.floor(meta.percent*0.11),'Архівація KMZ…'));
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name.replace(/\.csv$/i,'')+'.kmz';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  reportLine('Результат: '+a.download);reportLine('Статус: SUCCESS');
  setProgress(100,'Готово! ✓');
  setStatus('✓ Готово — KMZ завантажено автоматично.','success');
  }catch(e){
    reportLine('Статус: ERROR');reportLine('Причина: '+e.message);
    setProgress(0,'Помилка конвертації');
    setStatus('Не вдалося створити KMZ. Деталі — у TXT-звіті.','error');
    console.error(e);
  }finally{reportBtn.disabled=false;busy=false}
}
window.addEventListener('geo:input',()=>{
 const file=window.geoPendingFile;window.geoPendingFile=null;
 if(file&&!busy)processFile(file);
});
if(window.geoPendingFile){
 const pending=window.geoPendingFile;window.geoPendingFile=null;processFile(pending);
}
</script>
