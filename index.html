<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO CONVERTER — CSV → KMZ</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#080e1b;color:#eaf2ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#15315a 0,transparent 44%),#080e1b;min-height:100vh}
main{max-width:920px;margin:auto;padding:52px 22px 70px}.eyebrow{letter-spacing:.2em;font-size:12px;color:#80caff;font-weight:750}
h1{font-size:clamp(35px,7vw,68px);line-height:1.07;letter-spacing:-.05em;margin:15px 0 18px}
p{color:#adbed6;line-height:1.65}
.panel{border:1px solid #254064;background:#111e34df;border-radius:21px;padding:26px;margin-top:18px;box-shadow:0 22px 60px #0003}
.drop{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;min-height:218px;border:2px dashed #43658d;border-radius:15px;cursor:pointer;transition:.15s;background:#0c1729}
.drop:hover,.drop.drag{border-color:#53c8ff;background:#152a46}.symbol{font-size:38px;color:#77d8ff}.muted{font-size:13px;color:#92a9c8}
button{background:#4cb8f7;border:0;color:#061423;font-size:14px;font-weight:750;padding:12px 19px;border-radius:11px;cursor:pointer}button:hover{background:#9de2ff}
#file{display:none}#status{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:#d4e5f7;font-size:14px;max-width:70%}.error{color:#ffb4b4!important}.success{color:#a8f5bd!important}
footer{font-size:12px;margin-top:38px;color:#7790b0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:18px}
#drop #status{max-width:100%;text-align:center;line-height:1.5;margin:5px 12px 0;font-size:14px;font-weight:650}
#drop #status:empty{display:none}
#drop.processing{border-color:#66baff}
#drop.completed{border-color:#4fc88e}
#drop.failed{border-color:#f19c9c}
/* Animated progress adapted from the supplied example */
.drop-default{display:flex;align-items:center;flex-direction:column;gap:10px}
.drop.is-busy{cursor:default}
.drop.is-busy .drop-default{display:none}
.drop-progress{display:none;width:min(100%,540px);padding:18px 14px;pointer-events:none}
.drop.is-busy .drop-progress{display:block}
.progress-top{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:14px}
.progress-status{color:#c1c7dc;font-size:15px}
.progress-percent{font-size:clamp(36px,8vw,48px);font-weight:850;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.progress-track{height:17px;border-radius:99px;background:#30354c;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#8170ff,#43b9dc,#35dfc4);border-radius:inherit;transition:width .12s linear}
.progress-labels{display:flex;justify-content:space-between;color:#8790ae;font-size:12px;margin-top:15px;gap:8px}
@media(prefers-reduced-motion:reduce){.progress-fill{transition:none}}
#report{background:transparent;color:#aac6e7;border:1px solid #365474;padding:9px 13px;font-size:12px}#report:disabled{opacity:.4;cursor:not-allowed}
</style></head><body><main>
<h1>CSV → KMZ.</h1>
<section class="panel"><div class="drop" id="drop" tabindex="0" role="button" aria-label="Обрати CSV"><div class="drop-default"><div class="symbol">⇧</div><strong>Перетягни CSV сюди</strong><span class="muted">CSV · UTF-8 · до 20 МБ</span><button id="choose" type="button">Обрати CSV</button></div><div class="drop-progress" aria-label="Прогрес конвертації"><div class="progress-top"><span class="progress-status" id="progressStatus">Початок…</span><span class="progress-percent" id="progressPercent">0%</span></div><div class="progress-track" id="progressTrack" role="progressbar" aria-label="Прогрес" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><div class="progress-labels"><span>Початок</span><span>Обробка</span><span>Завершення</span></div></div><p id="status" aria-live="polite" role="status"></p></div><input id="file" type="file" accept=".csv,text/csv"></section>
<div class="row">
  <button id="report" type="button" disabled title="Завантажити короткий TXT-звіт">▤ TXT-звіт</button>
</div>
</main>
<script type="module">
import JSZip from 'https://esm.sh/jszip@3.10.1';
import * as mgrs from 'https://esm.sh/mgrs@2.1.0';

const fileInput=document.getElementById('file'),drop=document.getElementById('drop'),status=document.getElementById('status');
let reportText='';let reportFile='report.txt';let busy=false;
const progressFill=document.getElementById('progressFill'),progressPercent=document.getElementById('progressPercent'),progressStatus=document.getElementById('progressStatus'),progressTrack=document.getElementById('progressTrack');
function setProgress(p,label){p=Math.max(0,Math.min(100,Math.round(p)));progressFill.style.width=p+'%';progressPercent.textContent=p+'%';progressTrack.setAttribute('aria-valuenow',String(p));progressStatus.textContent=label;}
function frame(){return new Promise(resolve=>requestAnimationFrame(()=>resolve()))}
const reportBtn=document.getElementById('report');
function reportLine(message){reportText+='\n'+message}
const setStatus=(message,kind='')=>{
  status.textContent=message;
  status.className=kind;
  drop.classList.remove('processing','completed','failed');
  if(kind==='success')drop.classList.add('completed');
  else if(kind==='error')drop.classList.add('failed');
  else if(message)drop.classList.add('processing');
};
reportBtn.addEventListener('click',()=>{
  if(!reportText)return;
  const blob=new Blob(['\uFEFF'+reportText],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=reportFile;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
});
document.getElementById('choose').addEventListener('click',e=>{e.stopPropagation();fileInput.click()});
drop.addEventListener('click',()=>{if(!busy)fileInput.click()});
drop.addEventListener('keydown',e=>{if(!busy&&(e.key==='Enter'||e.key===' ')){e.preventDefault();fileInput.click()}});
for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')});
for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')});
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&!busy)processFile(f)});
fileInput.addEventListener('change',()=>{if(fileInput.files[0]&&!busy)processFile(fileInput.files[0]);fileInput.value=''});

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  let sample='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){i++;continue}quoted=!quoted}
  if(!quoted&&(c==='\n'||c==='\r'))break;sample+=c}
  const separators=[';',',','\t'];
  const counts=separators.map(sep=>{let q=false,n=0;for(let i=0;i<sample.length;i++){let c=sample[i];if(c==='"'){if(q&&sample[i+1]==='"'){i++;continue}q=!q}else if(!q&&c===sep)n++}return n});
  if(Math.max(...counts)===0)throw Error('Не вдалося визначити роздільник CSV');
  const sep=separators[counts.indexOf(Math.max(...counts))];
  let rows=[],row=[],field='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
  if(c==='"'){if(q&&text[i+1]==='"'){field+='"';i++}else if(q){q=false}else if(!field.trim()){q=true}else{field+=c}}
  else if(c===sep&&!q){row.push(field);field=''}
  else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}
  else field+=c}
  if(q)throw Error('Незакриті лапки у CSV');
  row.push(field);if(row.some(x=>x.trim()))rows.push(row);
  if(rows.length<2)throw Error('CSV має містити заголовки та хоча б один рядок');
  const headers=rows.shift().map((x,i)=>x.trim()||'column_'+(i+1));
  if(new Set(headers.map(h=>normalize(h))).size!==headers.length)throw Error('CSV має дубльовані заголовки колонок');
  const bad=rows.findIndex(r=>r.length!==headers.length);
  if(bad>=0)throw Error('Рядок '+(bad+2)+': кількість полів '+rows[bad].length+' замість '+headers.length);
  return {headers,records:rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i].trim()]))),sep};
}
const normalize=s=>String(s).normalize('NFKC').toLowerCase().replace(/[\uFEFF\u200B\s_\-().]/g,'');
function column(headers,variants){return headers.find(h=>variants.includes(normalize(h)))}
function num(s){let v=Number(String(s).trim().replace(',','.'));return s!==''&&Number.isFinite(v)?v:NaN}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}

function isMgrs(str){
  if(!str) return false;
  const s = String(str).trim().replace(/\s+/g,'');
  return /^[0-9]{1,2}[C-X][A-Z]{2}[0-9]{2,10}$/i.test(s) || /^[0-9]{1,2}[C-X]\s*[A-Z]{2}\s*[0-9]+\s*[0-9]+$/i.test(str.trim());
}
function parseMgrs(str){
  if(!str) throw new Error('порожній MGRS');
  const clean = String(str).trim().replace(/\s+/g,' ');
  try{
    const pt = mgrs.toPoint(clean.replace(/\s+/g,''));
    if(!pt || pt.length < 2) throw new Error('невалідний результат');
    return {lon: pt[0], lat: pt[1]};
  }catch(e){
    throw new Error('не вдалося розпарсити MGRS: '+clean);
  }
}

async function processFile(file){
  if(busy)return;
  busy=true;
  drop.classList.add('is-busy');
  setProgress(0,'Початок…');
  await frame();
  reportText='GEO CONVERTER — CSV REPORT\nФайл: '+file.name+'\nРозмір: '+file.size+' байтів';
  reportFile=file.name.replace(/\.csv$/i,'')+'_report.txt';
  reportBtn.disabled=true;
  try{
  if(file.size>20*1024*1024)throw Error('Файл перевищує обмеження 20 МБ');
  if(!/\.csv$/i.test(file.name))throw Error('Оберіть файл .csv');
  setStatus('');
  setProgress(5,'Читання CSV…');
  const content=await file.text();
  setProgress(15,'Перевірка структури…');
  await frame();
  const {headers,records,sep}=parseCSV(content);
  setProgress(25,'Обробка…');
  await frame();
  reportLine('Записів: '+records.length);reportLine('Колонок: '+headers.length);reportLine('Імпорт: успішно');reportLine('Роздільник: '+(sep==='\t'?'табуляція':sep));

  const latc=column(headers,['lat','latitude','широта','wgs84lat','wgs84latitude','gpslatitude']);
  const lonc=column(headers,['lon','lng','long','longitude','довгота','wgs84lon','wgs84longitude','gpslongitude']);
  const mgrsFirst = headers.find(h => /координати.*(перш|start|first)/i.test(h) || /mgrs.*first/i.test(h) || normalize(h).includes('координатипершої'));
  const mgrsLast = headers.find(h => /координати.*(остан|end|last)/i.test(h) || /mgrs.*last/i.test(h) || normalize(h).includes('координатиостанньої'));
  const mgrsAny = headers.filter(h => isMgrs(records[0]?.[h] || ''));

  let mode = 'none';
  if(latc && lonc) mode = 'wgs';
  else if(mgrsFirst && mgrsLast) mode = 'mgrs-pair';
  else if(mgrsAny.length >= 1) mode = 'mgrs-single';

  if(mode === 'none'){
    reportLine('Заголовки: '+headers.join(' | '));
    throw Error('Не знайдено колонок координат (WGS84 latitude/longitude або MGRS).');
  }
  reportLine('Режим координат: '+mode);

  const namec=column(headers,['name','title','назва','найменування','object','обєкт','id','номерцілі','номер']);
  let placemarks=[],errors=[],exported=0;

  for(let i=0;i<records.length;i++){
    const record=records[i];
    if(i%250===0){setProgress(25+55*i/records.length,'Обробка…');await frame();}
    try{
      const attrs=Object.entries(record).map(([k,v])=>'<Data name="'+esc(k)+'"><value>'+esc(v)+'</value></Data>').join('');
      const name=(namec&&record[namec])||'Об’єкт '+(i+1);

      if(mode === 'wgs'){
        const lat=num(record[latc]),lon=num(record[lonc]);
        if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)throw Error('координати поза межами WGS84');
        placemarks.push('<Placemark><name>'+esc(name)+'</name><ExtendedData>'+attrs+'<Data name="WGS84_lat"><value>'+lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+lon.toFixed(8)+','+lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        exported++;
      } else if(mode === 'mgrs-pair'){
        const p1 = parseMgrs(record[mgrsFirst]);
        const p2 = parseMgrs(record[mgrsLast]);
        // Point start
        placemarks.push('<Placemark><name>'+esc(name+' (початок)')+'</name><ExtendedData>'+attrs+'<Data name="point_type"><value>start</value></Data><Data name="WGS84_lat"><value>'+p1.lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+p1.lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+p1.lon.toFixed(8)+','+p1.lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        // Point end
        placemarks.push('<Placemark><name>'+esc(name+' (кінець)')+'</name><ExtendedData>'+attrs+'<Data name="point_type"><value>end</value></Data><Data name="WGS84_lat"><value>'+p2.lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+p2.lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+p2.lon.toFixed(8)+','+p2.lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        // Line
        const coords = p1.lon.toFixed(8)+','+p1.lat.toFixed(8)+',0 '+p2.lon.toFixed(8)+','+p2.lat.toFixed(8)+',0';
        placemarks.push('<Placemark><name>'+esc(name+' (трек)')+'</name><ExtendedData>'+attrs+'<Data name="geometry"><value>LineString</value></Data></ExtendedData><LineString><tessellate>1</tessellate><coordinates>'+coords+'</coordinates></LineString></Placemark>');
        exported += 3;
      } else if(mode === 'mgrs-single'){
        const col = mgrsAny[0];
        const p = parseMgrs(record[col]);
        placemarks.push('<Placemark><name>'+esc(name)+'</name><ExtendedData>'+attrs+'<Data name="WGS84_lat"><value>'+p.lat.toFixed(8)+'</value></Data><Data name="WGS84_lon"><value>'+p.lon.toFixed(8)+'</value></Data></ExtendedData><Point><coordinates>'+p.lon.toFixed(8)+','+p.lat.toFixed(8)+',0</coordinates></Point></Placemark>');
        exported++;
      }
    }catch(e){errors.push('Рядок '+(i+2)+': '+e.message)}
  }
  setProgress(80,'Завершення…');
  await frame();

  reportLine('Помилкових рядків: '+errors.length);
  if(errors.length)reportLine('Деталі помилок:\n'+errors.slice(0,50).join('\n')+(errors.length>50?'\n…':''));
  if(errors.length === records.length)throw Error('Усі рядки мають помилки координат.');
  if(!placemarks.length)throw Error('Немає об’єктів для конвертації');

  reportLine('Експортовано Placemark: '+placemarks.length);
  reportLine('Оброблено записів: '+(records.length - errors.length));

  const xml='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+esc(file.name)+'</name>'+placemarks.join('')+'</Document></kml>';
  const zip=new JSZip();zip.file('doc.kml',xml);
  setProgress(88,'Архівація KMZ…');
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},meta=>setProgress(88+Math.floor(meta.percent*0.11),'Архівація KMZ…'));
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name.replace(/\.csv$/i,'')+'.kmz';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  reportLine('Результат: '+a.download);reportLine('Статус: SUCCESS');
  setProgress(100,'Готово! ✓');
  setStatus('✓ Готово — KMZ завантажено автоматично.','success');
  }catch(e){
    reportLine('Статус: ERROR');reportLine('Причина: '+e.message);
    setProgress(0,'Помилка конвертації');
    setStatus('Не вдалося створити KMZ. Деталі — у TXT-звіті.','error');
    console.error(e);
  }finally{reportBtn.disabled=false;busy=false;drop.classList.remove('is-busy')}
}
</script></body></html>
